# Development overrides — overlay on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences vs prod:
#  - Expose backend (1337) and frontend (3000) directly to the host.
#  - Use development image targets with bind-mounted source and hot reload.
#  - Keep Linux node_modules in named volumes rather than using host modules.
#  - Relax CORS to localhost and do not start nginx.

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      target: development
    ports:
      - "1337:1337"
    volumes:
      - ./backend-halal:/app
      - backend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
      # Polling makes edits from Windows/macOS bind mounts reliable.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      # Disable Redis cache in dev if you prefer (remove or set to "false" to enable)
      REDIS_CACHE_DISABLED: "false"
      # The browser reaches the dev frontend through the host-mapped port.
      CLIENT_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}

  frontend:
    build:
      target: development
    ports:
      - "3001:3000"
    volumes:
      - ./web-halal:/app
      - frontend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Needed when Docker Desktop cannot forward host filesystem events.
      WATCHPACK_POLLING: "true"
      # Server-side fetch uses internal Docker network name
      STRAPI_INTERNAL_URL: "http://backend:1337"
      # In dev you can set a fixed secret or leave a placeholder
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}

  # One-shot seed service: runs seed.js then exits.
  # Only runs on first boot (seed script checks initHasRun flag in DB).
  # Reuses the already-built backend image — no separate build needed.
  seeder:
    image: halal-backend
    command: ["node", "scripts/seed.js"]
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-halal}
      DATABASE_USERNAME: ${POSTGRES_USER:-halal}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - strapi-uploads:/app/public/uploads
    networks: [internal]
    profiles: ["seed"]

  # Not needed in dev — stop it if it was started.
  nginx:
    profiles: ["never"]

# Declare volumes used by dev-only services (seeder shares the backend uploads volume)
volumes:
  strapi-uploads:
    external: true
    name: halal_strapi-uploads
  backend-node-modules:
  frontend-node-modules:

