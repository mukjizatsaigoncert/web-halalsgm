# Development overrides — overlay on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences vs prod:
#  - Expose backend (1337) and frontend (3000) directly to the host
#  - Relax CORS to localhost
#  - Skip nginx (comment out reference in compose up)
#  - Mount source code for live reload (use only with dev targets below)

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
      # Disable Redis cache in dev if you prefer (remove or set to "false" to enable)
      REDIS_CACHE_DISABLED: "false"

  frontend:
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      # Server-side fetch uses internal Docker network name
      STRAPI_INTERNAL_URL: "http://backend:1337"
      # In dev you can set a fixed secret or leave a placeholder
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}

  # Not needed in dev — stop it if it was started.
  nginx:
    profiles: ["never"]
