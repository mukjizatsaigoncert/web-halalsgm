user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size 25m;

  # --- Logging ---
  log_format main '$remote_addr - $remote_user [$time_iso8601] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # --- Compression (gzip + brotli via fholzer/nginx-brotli image) ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml application/xml+rss
             image/svg+xml application/wasm font/woff2;

  brotli on;
  brotli_comp_level 6;
  brotli_min_length 256;
  brotli_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss
               image/svg+xml application/wasm font/woff2;

  # --- Cloudflare real-IP passthrough ---
  # These are Cloudflare's published egress ranges (update periodically from
  # https://www.cloudflare.com/ips/). We tell nginx to trust them so that
  # $remote_addr (and therefore rate-limit keys) reflect the true client IP.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  # IPv6
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # --- Rate-limit zones (key on real client IP after CF passthrough) ---
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;

  # --- Proxy cache for static media from Strapi ---
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m
                   max_size=2g inactive=30d use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
