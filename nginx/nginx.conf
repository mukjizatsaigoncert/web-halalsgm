user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;
  client_max_body_size 25m;

  # --- Logging ---
  log_format main '$remote_addr - $remote_user [$time_iso8601] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # --- Compression ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml application/xml+rss
             image/svg+xml application/wasm font/woff2;

  # --- Rate-limit zones ---
  # General API burst
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  # Contact endpoint (tighter)
  limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
  # Admin endpoints (prevent brute force on Strapi admin login)
  limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;

  # --- Proxy cache for static media from Strapi ---
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m
                   max_size=2g inactive=30d use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
