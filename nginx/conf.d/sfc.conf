# ---- redirect everything to HTTPS ----
server {
  listen 80;
  listen [::]:80;
  server_name dienanhtruyenhinhsaigon.vn www.dienanhtruyenhinhsaigon.vn api.dienanhtruyenhinhsaigon.vn;

  # ACME challenge (Let's Encrypt)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- shared SSL + security headers ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# ---- FE: sfc.vn, www.sfc.vn ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dienanhtruyenhinhsaigon.vn www.dienanhtruyenhinhsaigon.vn;

  ssl_certificate     /etc/nginx/certs/live/dienanhtruyenhinhsaigon.vn/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/dienanhtruyenhinhsaigon.vn /privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── Immutable static assets: cache at CDN + browser for 1 year ──
  location /_next/static/ {
    proxy_pass http://frontend:3000;
    add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
  }

  # ── Next.js image optimization ──
  location /_next/image {
    proxy_pass http://frontend:3000;
    add_header Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=3600" always;
    add_header Vary "Accept" always;
  }

  # ── HTML pages: let Cloudflare edge-cache for 5 min, SWR 10 min ──
  location / {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    # Cloudflare will respect s-maxage for edge TTL
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=600" always;
    add_header Vary "Accept-Encoding" always;
  }
}

# ---- BE: api.sfc.vn ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.sfc.vn;

  ssl_certificate     /etc/nginx/certs/live/api.dienanhtruyenhinhsaigon.vn/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/api.dienanhtruyenhinhsaigon.vn/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Tight limit for contact form (also enforced in Strapi)
  location = /api/contacts {
    limit_req zone=contact burst=3 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
    add_header Cache-Control "no-store" always;
  }

  # Strapi admin login
  location ~ ^/admin/login {
    limit_req zone=admin burst=5 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
    add_header Cache-Control "no-store" always;
  }

  # Strapi admin panel — never cached by CDN
  location /admin {
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
    add_header Cache-Control "no-store" always;
  }

  # Cache public media at Cloudflare edge for 30 days, browser for 7 days
  location /uploads/ {
    proxy_pass http://backend:1337;
    proxy_cache media;
    proxy_cache_valid 200 7d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=604800, s-maxage=2592000, stale-while-revalidate=86400" always;
    add_header Vary "Accept-Encoding" always;
  }

  # Public REST API — Redis handles caching, Cloudflare should bypass or use
  # a short edge TTL (configured via Cloudflare Cache Rules in the dashboard).
  # We emit X-Cache so you can verify Redis hit/miss in response headers.
  location / {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
    # Let Cloudflare cache public GET responses for 1 min at the edge.
    # Redis on the origin already serves most requests from memory.
    add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=30" always;
    add_header Vary "Accept-Encoding, Accept" always;
  }
}
