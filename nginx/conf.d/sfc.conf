# ---- redirect everything to HTTPS ----
server {
  listen 80;
  listen [::]:80;
  server_name sfc.vn www.sfc.vn api.sfc.vn;

  # ACME challenge (Let's Encrypt)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- shared SSL + security headers ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# ---- FE: sfc.vn, www.sfc.vn ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sfc.vn www.sfc.vn;

  ssl_certificate     /etc/nginx/certs/live/sfc.vn/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/sfc.vn/privkey.pem;

  # Next.js handles its own security headers; we add HSTS at the edge so it
  # applies even to 4xx responses that bypass the app.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Cache static assets served via Next.js /public and /_next/static
  location /_next/static/ {
    proxy_pass http://frontend:3000;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}

# ---- BE: api.sfc.vn ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.sfc.vn;

  ssl_certificate     /etc/nginx/certs/live/api.sfc.vn/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/api.sfc.vn/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Tight limit for contact form (also enforced in Strapi)
  location = /api/contacts {
    limit_req zone=contact burst=3 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Strapi admin login
  location ~ ^/admin/login {
    limit_req zone=admin burst=5 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
  }

  # Cache public media
  location /uploads/ {
    proxy_pass http://backend:1337;
    proxy_cache media;
    proxy_cache_valid 200 7d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://backend:1337;
    include /etc/nginx/conf.d/proxy-params.conf;
  }
}
