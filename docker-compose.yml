# Production-style full stack: PostgreSQL + Strapi + Next.js behind nginx.
# Copy .env.example to .env and fill in values before `docker compose up -d`.
#
# For local development use docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: sfc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfc}
      POSTGRES_USER: ${POSTGRES_USER:-sfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfc} -d ${POSTGRES_DB:-sfc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  backend:
    build:
      context: ./backend-sfc
      dockerfile: Dockerfile
    image: sfc-backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://api.sfc.local}
      # --- Strapi secrets (required) ---
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # --- Database ---
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-sfc}
      DATABASE_USERNAME: ${POSTGRES_USER:-sfc}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      # --- Redis cache ---
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-60}
      # --- Security ---
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sfc.vn}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      # --- Observability (optional) ---
      SENTRY_DSN: ${BACKEND_SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # --- Cloudflare R2 storage (optional — leave blank to use local disk) ---
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-sfc-uploads}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      - strapi-uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1337/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks: [internal]

  frontend:
    build:
      context: ./web-sfc
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-https://api.sfc.vn}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sfc.vn}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side fetch uses internal Docker network name
      STRAPI_INTERNAL_URL: "http://backend:1337"
      # Shared secret for Strapi → Next.js cache revalidation webhook
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # Sentry runtime options (only used if DSN is set).
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [internal, web]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: sfc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks: [web, internal]

volumes:
  postgres-data:
  strapi-uploads:
  nginx-cache:
  redis-data:

networks:
  # Internal services (db, backend) are not exposed to the host.
  internal:
    driver: bridge
  # Anything connected to `web` is reachable via nginx.
  web:
    driver: bridge
